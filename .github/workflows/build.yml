# Tests and packages Seoul for Windows and macOS on every push to main.
# Pushing a v* tag also gathers both zips into a draft GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --target-dir target/package
      - run: ./packaging/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: ./packaging/package-macos.sh
      # A smoke test of the bundle without a GPU: the binary runs, and the
      # signature and plist hold together.
      - run: |
          app=$(ls -d dist/*/Seoul.app)
          "$app/Contents/MacOS/seoul" --help
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/seoul"
      # Best effort: render a real frame if the runner's virtual GPU allows.
      # Launched from / like Finder would, so the Application Support setup
      # and the Mac fonts get exercised too.
      - name: Render a frame (best effort)
        continue-on-error: true
        run: |
          app="$PWD/$(ls -d dist/*/Seoul.app)"
          cd /
          "$app/Contents/MacOS/seoul" --synth --preset Ink --screenshot-at 2 --size 1280x720 > "$RUNNER_TEMP/seoul.log" 2>&1 &
          pid=$!
          sleep 20
          kill $pid 2>/dev/null || true
          cat "$RUNNER_TEMP/seoul.log"
          mkdir -p "$RUNNER_TEMP/render"
          cp "$HOME/Library/Application Support/Seoul/screenshots/"*.png "$RUNNER_TEMP/render/"
          cp "$RUNNER_TEMP/seoul.log" "$RUNNER_TEMP/render/"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: macos-render
          path: ${{ runner.temp }}/render
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release (notes are written by hand before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --draft --title "Seoul ${TAG#v}" --notes "Draft: notes to follow."
