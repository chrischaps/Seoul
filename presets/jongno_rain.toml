name = "Jongno Rain"
author = "seoul"
description = "A wet night in an old Seoul alley: neon Hangul signs light up like VU meters and flare on the kick, hats glint in the rain, snares bring lightning, kicks ripple the puddles; when the beat drops out, the neon goes dark."
edge = "clamp"

# Who does what:
#   spectrum  each neon sign is a VU meter for one fifth of the spectrum
#   kick      the neon flares and a ring drops into the puddles
#   snare     lightning (a bolt about a third of the time)
#   hat       the rain glints and splashes the street
#   groove    while the kicks keep coming the alley is lit; in a kick-less
#             breakdown the signs sputter out one by one, leaving rain,
#             lightning and the lit doors, until the drop powers them back on
[params]
groove = { follow = "step(kick_age, 1.1 * 60 / bpm)", tau = 0.35 }

[mapping]
zoom        = "1.0"
rotation    = "0.0"
warp_amount = "0.0"
decay       = "0.80"

[shader]
composite = "jongno_rain.wgsl"
warp      = "jongno_rain_warp.wgsl"

[palette]
color0 = [0.03, 0.04, 0.10, 1.0]   # rain-dark indigo
color1 = [1.00, 0.20, 0.52, 1.0]   # neon pink
color2 = [0.12, 0.85, 1.00, 1.0]   # neon cyan
color3 = [1.00, 0.64, 0.30, 1.0]   # hanji lamplight

[post]
bloom           = 0.9
bloom_threshold = 0.3
vignette        = 0.45
grain           = 0.3
saturation      = 1.1
chroma          = "snare * 0.25"
