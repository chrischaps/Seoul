name = "Indra's Pearls"
author = "seoul"
description = "Indra's net from Hwaeom Buddhism: every pearl reflects every other, in a hyperbolic disk of mirrors."

# Five mirror-circles meet the unit circle at right angles; reflecting in
# them over and over tiles the Poincaré disk, with the tiles shrinking into
# a necklace of pearls at the rim. `open` sets the circles' size: at 1 they
# touch (an ideal-pentagon tiling); below 1, gaps open and the rim breaks
# into dust. The view glides through the hyperbolic plane.
#   kick   the mirrors swell shut, the net closes and every pearl's rim
#          flares; the view lurches toward the rim, where the pearls crowd
#   snare  a wave of gold runs outward through the generations
#   hat    the rims glint
#   groove (kicks flowing) without it the net loosens into dust, the glide
#          slows and the tiles dim, until the drop pulls it shut again
[params]
groove = { follow = "step(kick_age, 1.1 * 60 / bpm)", tau = 0.35 }
punch  = { follow = "kick", tau = 0.1 }
open   = { follow = "0.84 + groove * 0.08 + bass_att * 0.03 + punch * 0.10", tau = 0.08 }
spin   = { rate = "0.01 + groove * 0.02 + mid_att * 0.02", wrap = 6.2831853 }
orbit  = { rate = "0.03 + groove * 0.04 + bass_att * 0.04", wrap = 6.2831853 }
reach  = { follow = "0.22 + mid_att * 0.25", tau = 1.2 }
ax     = "reach * cos(orbit)"
ay     = "reach * sin(orbit)"
shine  = { follow = "treble * 0.4 + hat * 0.8", tau = 0.08 }
# Kicks and bass draw the view down toward the rim (up to ~12×) and quiet
# lets it float back out; `aim` slowly picks which stretch of the necklace.
dive   = { follow = "groove * 0.8 + bass_att * 1.2 + punch * 0.8", tau = 0.5 }
aim    = { rate = "0.04", wrap = 6.2831853 }

[mapping]
zoom        = "1.0"
rotation    = "0"
warp_amount = "0"
decay       = "0.80"

[shader]
composite = "indras_pearls.wgsl"

[palette]
color0 = [0.02, 0.02, 0.05, 1.0]   # obsidian
color1 = [0.18, 0.62, 0.70, 1.0]   # celadon
color2 = [0.95, 0.78, 0.45, 1.0]   # pale gold
color3 = [0.95, 0.93, 0.98, 1.0]   # pearl

[post]
bloom      = 0.7
exposure   = "0.85 + groove * 0.2"
bloom_threshold = 0.3
vignette   = 0.4
grain      = 0.06
