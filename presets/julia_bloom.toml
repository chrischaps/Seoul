name = "Julia Bloom"
author = "seoul"
description = "A Julia set riding the rim of the Mandelbrot heart; every kick shatters it to dust and drops you a level deeper."

# c walks the boundary of the Mandelbrot set's main cardioid, where the
# Julia sets are most varied. Bass speeds the walk.
#   kick   the dive lurches a level deeper, c is shoved outside the set (lace
#          shatters into dust and knits back), and the rim flares
#   snare  the colors jump around the palette and the orbit-trap filigree flashes
#   hat    a fine shimmer in the filigree
#   groove (kicks flowing) without it, in breakdowns, the fall slows to a
#          drift and the set dims and cools
[params]
groove = { follow = "step(kick_age, 1.1 * 60 / bpm)", tau = 0.35 }
punch  = { follow = "kick", tau = 0.08 }
snap   = { follow = "snare", tau = 0.1 }
theta  = { rate = "0.02 + groove * 0.03 + bass_att * 0.03", wrap = 6.2831853 }
push   = { follow = "0.985 + punch * 0.07 + bass * 0.01", tau = 0.12 }
# Skip the cusp (θ near 0), where the dive's fixed point stops repelling.
ang    = "0.5 + theta * 0.8408"
cx     = "(cos(ang) * 0.5 - cos(2 * ang) * 0.25) * push"
cy     = "(sin(ang) * 0.5 - sin(2 * ang) * 0.25) * push"
spin   = { rate = "0.01 + groove * 0.02 + mid_att * 0.02" }
trap   = { follow = "treble * 0.5 + hat * 0.6", tau = 0.08 }
# The dive: one unit falls exactly one level into the Julia set, spiraling
# into its repelling fixed point. Kicks shove it a level deeper.
speed  = { follow = "0.05 + groove * 0.12 + bass_att * 0.15 + kick * 2.2", tau = 0.12 }
dive   = { rate = "speed", wrap = 1.0 }

[mapping]
zoom        = "1.005 + bass * 0.006"
rotation    = "0.0015"
warp_amount = "0"
decay       = "0.88"
blur        = "0.15"

[shader]
composite = "julia_bloom.wgsl"

[palette]
color0 = [0.05, 0.05, 0.20, 1.0]   # deep indigo
color1 = [0.95, 0.42, 0.32, 1.0]   # coral
color2 = [0.88, 0.36, 0.58, 1.0]   # rose
color3 = [0.96, 0.92, 0.84, 1.0]   # bone

[post]
bloom      = 0.55
# The whole picture settles a little in breakdowns.
exposure   = "0.85 + groove * 0.2"
saturation = 1.25
vignette = 0.35
grain    = 0.08
