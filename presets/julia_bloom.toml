name = "Julia Bloom"
author = "seoul"
description = "A Julia set riding the rim of the Mandelbrot heart; beats scatter it to dust."

# c walks the boundary of the Mandelbrot set's main cardioid, where the
# Julia sets are most varied. Bass speeds the walk; beats push c just
# outside, so the set breaks from lace into dust and knits back together.
[params]
theta = { rate = "0.035 + bass_att * 0.05", wrap = 6.2831853 }
push  = { follow = "0.985 + beat * 0.05 + bass * 0.02", tau = 0.22 }
# Skip the cusp (θ near 0), where the dive's fixed point stops repelling.
ang   = "0.5 + theta * 0.8408"
cx    = "(cos(ang) * 0.5 - cos(2 * ang) * 0.25) * push"
cy    = "(sin(ang) * 0.5 - sin(2 * ang) * 0.25) * push"
spin  = { rate = "0.015 + mid_att * 0.03" }
trap  = { follow = "treble", tau = 0.12 }
# The dive: one unit falls exactly one level into the Julia set, spiraling
# into its repelling fixed point. Bass speeds the fall.
speed = { follow = "0.12 + bass_att * 0.30 + beat * 0.15", tau = 0.3 }
dive  = { rate = "speed", wrap = 1.0 }

[mapping]
zoom        = "1.005 + bass * 0.006"
rotation    = "0.0015"
warp_amount = "0"
decay       = "0.88"
blur        = "0.15"

[shader]
composite = "julia_bloom.wgsl"

[palette]
color0 = [0.05, 0.05, 0.20, 1.0]   # deep indigo
color1 = [0.95, 0.42, 0.32, 1.0]   # coral
color2 = [0.88, 0.36, 0.58, 1.0]   # rose
color3 = [0.96, 0.92, 0.84, 1.0]   # bone

[post]
bloom      = 0.55
saturation = 1.25
vignette = 0.35
grain    = 0.08
