name = "Plasma"
author = "seoul"
description = "Heavy warp, color-cycling sinusoidal fields."

[mapping]
zoom        = "1.0 + bass * 0.03 + sin(time * 0.4) * 0.01"
rotation    = "sin(time * 0.2) * 0.010 + mid * 0.008"
warp_amount = "0.020 + beat * 0.045 + abs(sin(time * 0.7)) * 0.010"
decay       = "0.970 + treble * 0.012"

[shader]
composite = "plasma.wgsl"

[post]
saturation = 1.35
contrast = 1.15

[palette]
color0 = [0.85, 0.25, 0.45, 1.0]   # magenta
color1 = [0.30, 0.35, 0.95, 1.0]   # electric blue
color2 = [0.95, 0.80, 0.30, 1.0]   # golden yellow
color3 = [0.30, 0.90, 0.70, 1.0]   # mint green
