name = "Window Within"
author = "seoul"
description = "A lamplit changsal window that holds itself, spiraling inward forever; the kick is the lamp, the snare blossoms in the shadows."

# The picture is one window: a wooden frame, a lattice, and lamplit paper
# around a square opening, and through the opening, the same window,
# 1/S the size. Escher's map turns those nested copies into one spiral,
# and `dive` descends a level per unit, exactly, so it never runs out.
#
# Kick: the lamp behind the paper flares and the descent lurches inward.
# Snare: the plum blossoms in the branch's shadow light up pink, and
#   light races around the frames.
# Hats: the lattice bars glint.
# Groove (kicks flowing) keeps the lamp warm and the spiral turning; in a
# breakdown the lamp sinks low, moonlight cools the paper, and the
# descent slows to a drift.
#
# Soba link (docs/LINK.md): a patch's gate 1 plays the kick, gate 2 the
# snare and gate 3 the hats. cv1 brightens the lamp, cv2 warms the paper
# and cv3 hurries the descent. An empty lane changes nothing.
[params]
kick_t = "mix(kick_age, gate1_age, link_live * step(0.5, gate1_count))"
snare_t = "mix(snare_age, gate2_age, link_live * step(0.5, gate2_count))"
hat_t = "mix(hat_age, gate3_age, link_live * step(0.5, gate3_count))"
groove = { follow = "step(kick_t, 1.1 * 60 / bpm)", tau = 0.35 }
hit    = "exp(-kick_t * 6)"
clap   = "exp(-snare_t * 4)"
tick   = "exp(-hat_t * 14)"
speed  = { follow = "0.03 + groove * (0.05 + bass_att * 0.12) + hit * 0.7 + abs(cv3) * 0.3", tau = 0.06 }
dive   = { rate = "speed", wrap = 1.0 }
spin   = { rate = "0.006 + groove * (0.01 + mid_att * 0.02)" }
lamp   = "0.24 + groove * 0.46 + hit * 0.5 + max(cv1, 0) * 0.3"
warm   = { follow = "max(mid_att + cv2, 0)", tau = 1.5 }
shim   = { follow = "treble", tau = 0.1 }

[mapping]
zoom        = "1.002 + hit * 0.006"
rotation    = "0"
warp_amount = "0"
decay       = "0.84"
blur        = "0.15"

[shader]
composite = "droste_window.wgsl"

[palette]
color0 = [0.03, 0.04, 0.12, 1.0]   # night indigo
color1 = [1.00, 0.50, 0.18, 1.0]   # hanji lamplight
color2 = [0.40, 0.20, 0.10, 1.0]   # wood
color3 = [0.92, 0.94, 1.00, 1.0]   # moon white

[post]
bloom      = 0.5
saturation = 1.1
vignette   = 0.45
grain      = 0.18
