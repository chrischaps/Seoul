name = "Snake"
author = "seoul"
description = "Pixelated string wiggling across the screen, leaving a dithered trail."

[mapping]
zoom        = "1.0"
rotation    = "0.0"
warp_amount = "0.0"
decay       = "0.978 + treble * 0.012"

[shader]
composite = "snake.wgsl"

[post]
# The look of the LED panel this preset was modeled on (ref/).
led_mask = true
led_pitch = 7.0
bloom = 0.5

[palette]
color0 = [0.10, 0.18, 0.55, 1.0]   # deep blue (rim)
color1 = [0.30, 0.55, 0.95, 1.0]   # mid blue (band)
color2 = [0.55, 0.80, 1.00, 1.0]   # bright blue
color3 = [0.95, 0.97, 1.00, 1.0]   # white-blue (core)
