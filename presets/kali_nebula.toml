name = "Starfield of Kali"
author = "seoul"
description = "Kali's fold, |p|/|p|² − c, repeated until it blooms into nebulae; the music weathers its shape."

# The fold constant follows the mid/treble balance with a slow time
# constant, so the nebula changes the way weather does instead of jumping
# on every note. The view flies forward through layered depths, faster
# with the bass, and turns slowly; beats sparkle the stars.
[params]
cx    = { follow = "0.62 + mid_att * 0.10 - treble_att * 0.05", tau = 1.5 }
cy    = { follow = "0.52 + bass_att * 0.06", tau = 1.5 }
# Flight speed: one unit passes through one octave of depth (×5 zoom).
fly   = { rate = "0.05 + bass_att * 0.10 + beat * 0.06" }
turn  = { rate = "0.01" }
depth = { follow = "1.25 - bass_att * 0.25", tau = 0.8 }

[mapping]
zoom        = "1.004 + bass_att * 0.004"
rotation    = "0"
warp_amount = "0"
decay       = "0.86"
blur        = "0.35"

[shader]
composite = "kali_nebula.wgsl"

[palette]
color0 = [0.02, 0.02, 0.08, 1.0]   # void
color1 = [0.20, 0.30, 0.75, 1.0]   # cobalt
color2 = [0.85, 0.35, 0.55, 1.0]   # magenta dust
color3 = [1.00, 0.85, 0.60, 1.0]   # starlight

[post]
bloom      = 0.65
saturation = 1.2
vignette   = 0.45
grain      = 0.12
