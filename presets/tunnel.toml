name = "Tunnel"
author = "seoul"
description = "Strong inward zoom, sparse bright core, cool blues."

# Soba link (docs/LINK.md): a patch's gate 1 plays the beat that flares the
# core and the magenta ring. cv1 brightens the rings, cv2 turns their colors
# and cv3 spins the tunnel faster. An empty lane changes nothing.
[params]
pulse = "mix(beat, exp(-gate1_age * 10), link_live * step(0.5, gate1_count))"

[mapping]
zoom        = "1.0 + bass * 0.12 + 0.01"
rotation    = "0.003 + mid * 0.020 + abs(cv3) * 0.025"
warp_amount = "0.004 + pulse * 0.025"
decay       = "0.968 + treble * 0.010"

[shader]
composite = "tunnel.wgsl"

[palette]
color0 = [0.05, 0.10, 0.30, 1.0]   # deep blue background
color1 = [0.20, 0.55, 0.95, 1.0]   # cyan ring
color2 = [0.85, 0.35, 0.70, 1.0]   # magenta accent on beat
color3 = [1.00, 0.95, 0.85, 1.0]   # warm white core
