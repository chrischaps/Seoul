name = "Ink"
author = "seoul"
description = "Pale ink diffusing through dark water. Beats release clouds; a cinnabar thread traces the waveform."
edge = "fade"

# Soba link (docs/LINK.md): a patch's gate 1 plays the beat that releases
# the ink. cv1 swells the drop, cv2 tints the ink warm (cinnabar) or cool
# (slate) and cv3 stirs the water. An empty lane changes nothing.
[params]
pulse = "mix(beat, exp(-gate1_age * 10), link_live * step(0.5, gate1_count))"

[mapping]
zoom        = "1.0 + bass_att * 0.003"
rotation    = "0.0"
warp_amount = "0.0"
decay       = "0.986"
blur        = "0.04"

[shader]
composite = "ink.wgsl"
warp      = "ink_warp.wgsl"

[palette]
color0 = [0.02, 0.02, 0.03, 1.0]   # ink black
color1 = [0.82, 0.84, 0.88, 1.0]   # pale ink
color2 = [0.85, 0.14, 0.10, 1.0]   # cinnabar seal
color3 = [0.95, 0.93, 0.88, 1.0]   # rice paper

[post]
bloom     = 0.25
vignette  = 0.5
grain     = 0.35
saturation = 0.9
chroma    = "pulse * 0.6"

[particles]
count      = 40000
spawn      = "center"
speed      = 0.04
flow       = 0.9
flow_scale = 2.5
drag       = 1.2
size       = 2.0
life       = 4.0
color      = 3
burst      = 0.45
intensity  = 0.018
