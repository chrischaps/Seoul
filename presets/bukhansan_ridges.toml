name = "Bukhansan Ridges"
author = "seoul"
description = "Granite ridgelines receding into mist, each one the song as it sounded a moment earlier; kicks send mist up the valleys, snares run light back across the crests, and a day passes at the pace of the music."
edge = "clamp"

[mapping]
zoom        = "1.0"
rotation    = "0.0"
warp_amount = "0.0"
decay       = "0.5"

# Who does what:
#   spectrum  the ridgelines: the nearest is now, each farther one older
#   kick      mist surges up the valleys and the nearest crests catch light
#   snare     a wave of light runs back across the crests, range by range
#             (and at night, now and then, a meteor)
#   hat       the stars twinkle
#   groove    while the kicks keep coming the sky glows and the day turns;
#             in a kick-less breakdown cloud shadow dims the range and time
#             slows, until the drop brings the light back
#
# Soba link (docs/LINK.md): a patch's gate 1 plays the kick, gate 2 the
# snare and gate 3 the hats. cv1 lifts the cloud shadow and the mist, cv2
# turns the hour (toward afterglow or toward night) and cv3 hurries the
# day along. An empty lane changes nothing.
[params]
kick_t = "mix(kick_age, gate1_age, link_live * step(0.5, gate1_count))"
groove = { follow = "step(kick_t, 1.1 * 60 / bpm)", tau = 0.35 }
# 0 → 1 is one day: afterglow at 0 and 1, deep night at 0.5. A day takes
# about 1½–2 minutes while the music drives; it all but stops in a breakdown.
day = { rate = "0.002 + groove * 0.008 + volume * 0.002 + abs(cv3) * 0.02", wrap = 1.0 }

[shader]
composite = "bukhansan_ridges.wgsl"

[palette]
color0 = [0.16, 0.18, 0.42, 1.0]   # dusk blue
color1 = [1.00, 0.52, 0.36, 1.0]   # afterglow
color2 = [0.55, 0.66, 0.88, 1.0]   # valley haze
color3 = [0.95, 0.93, 0.86, 1.0]   # moonlight

[post]
bloom           = 0.5
bloom_threshold = 0.45
vignette        = 0.35
grain           = 0.2
