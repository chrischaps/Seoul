name = "Kaleidoscope"
author = "seoul"
description = "Six-fold symmetric pattern, sharp triangular sectors, vibrant primaries."

[mapping]
zoom        = "1.0 + bass * 0.04"
rotation    = "0.012 + mid * 0.025"
warp_amount = "0.005 + beat * 0.020"
decay       = "0.965 + treble * 0.012"

[shader]
composite = "kaleidoscope.wgsl"

[palette]
color0 = [0.95, 0.20, 0.30, 1.0]   # vivid red
color1 = [0.95, 0.85, 0.20, 1.0]   # vivid yellow
color2 = [0.20, 0.50, 0.95, 1.0]   # vivid blue
color3 = [0.30, 0.85, 0.40, 1.0]   # vivid green
