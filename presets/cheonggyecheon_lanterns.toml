name = "Cheonggyecheon Lanterns"
author = "seoul"
description = "Lotus and silk lanterns drift down the stream through downtown Seoul, each glowing with one band of the music and flaring on the kick; more are set afloat as the song goes on."
edge = "clamp"

[mapping]
zoom        = "1.0"
rotation    = "0.0"
warp_amount = "0.0"
decay       = "0.85"

# Who does what:
#   spectrum  each lantern's inner glow is one spectrum bin
#   kick      every lantern's flame flares, and their reflections with it
#   snare     a flash runs along the string lights on the upper walk
#   hat       the string lights twinkle and the water glints
#   groove    while the kicks keep coming the stream runs bright and quick;
#             in a kick-less breakdown the lanterns burn low and the
#             current slackens, until the drop rekindles them
#
# Soba link (docs/LINK.md): a patch's gate 1 plays the kick, gate 2 the
# snare and gate 3 the hats. cv1 feeds the flames, cv2 turns the silk's
# colors and cv3 quickens the current. An empty lane changes nothing.
[params]
kick_t = "mix(kick_age, gate1_age, link_live * step(0.5, gate1_count))"
groove = { follow = "step(kick_t, 1.1 * 60 / bpm)", tau = 0.35 }
# The current, in screen widths per second (near lane), eased so it swells
# with the groove and the bass without lurching; `flow` is how far it has
# carried.
speed = { follow = "0.012 + groove * 0.025 + bass_att * 0.015 + abs(cv3) * 0.04", tau = 1.0 }
flow  = { rate = "speed" }

[shader]
composite = "cheonggyecheon_lanterns.wgsl"
warp      = "cheonggyecheon_lanterns_warp.wgsl"

[palette]
color0 = [0.06, 0.08, 0.20, 1.0]   # night water
color1 = [1.00, 0.35, 0.45, 1.0]   # lotus pink
color2 = [1.00, 0.72, 0.32, 1.0]   # lamplight
color3 = [0.55, 0.85, 0.45, 1.0]   # celadon

[particles]
count     = 1500
spawn     = "random"
speed     = 0.01
flow      = 0.3
flow_scale = 2.0
drag      = 1.0
size      = 2.0
life      = 4.0
color     = 2
gravity   = -0.02
intensity = 0.015

[post]
bloom           = 0.45
bloom_threshold = 0.6
vignette        = 0.4
grain           = 0.2
saturation      = 1.1
