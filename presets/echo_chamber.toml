name = "Echo Chamber"
author = "seoul"
description = "Five sparks trace Lissajous orbits; hue drift turns their trails to ribbons, folded four ways with a flipped echo."

# Soba link (docs/LINK.md): a patch's gate 1 plays the beat the sparks
# swell on. cv1 brightens the sparks, cv2 turns the ribbons' hue drift
# either way and cv3 speeds the orbits. An empty lane changes nothing.
[params]
pulse = "mix(beat, exp(-gate1_age * 10), link_live * step(0.5, gate1_count))"
orbit = { rate = "1 + abs(cv3) * 1.5" }

[mapping]
zoom        = "1.004 + bass * 0.010"
rotation    = "0.004 * sin(time * 0.13)"
warp_amount = "0.002 + pulse * 0.005"
decay       = "0.976"
hue_shift   = "1.3 + cv2 * 2.0"

[shader]
composite = "echo_chamber.wgsl"

[palette]
color0 = [0.95, 0.30, 0.55, 1.0]   # rose
color1 = [0.25, 0.75, 0.95, 1.0]   # sky
color2 = [0.98, 0.80, 0.30, 1.0]   # marigold
color3 = [0.90, 0.92, 1.00, 1.0]   # white

[post]
mirror      = "quad"
echo_alpha  = 0.4
echo_zoom   = "1.3 + bass_att * 0.15"
echo_orient = "xy"
bloom       = 0.45
