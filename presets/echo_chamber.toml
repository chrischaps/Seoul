name = "Echo Chamber"
author = "seoul"
description = "Three sparks trace Lissajous orbits; hue drift turns their trails to ribbons, folded four ways with a flipped echo."

[mapping]
zoom        = "1.010 + bass * 0.015"
rotation    = "0.004 * sin(time * 0.13)"
warp_amount = "0.002 + beat * 0.005"
decay       = "0.962"
hue_shift   = "0.4"

[shader]
composite = "echo_chamber.wgsl"

[palette]
color0 = [0.95, 0.30, 0.55, 1.0]   # rose
color1 = [0.25, 0.75, 0.95, 1.0]   # sky
color2 = [0.98, 0.80, 0.30, 1.0]   # marigold
color3 = [0.90, 0.92, 1.00, 1.0]   # white

[post]
mirror      = "quad"
echo_alpha  = 0.4
echo_zoom   = "1.3 + bass_att * 0.15"
echo_orient = "xy"
bloom       = 0.45
