name = "Spectrum"
author = "seoul"
description = "Phase 2 spectrum bars and waveform line, with warped trails."

[mapping]
zoom        = "1.0 + bass * 0.02"
rotation    = "0.0"
warp_amount = "0.003 + beat * 0.010"
decay       = "0.955 + treble * 0.010"

[shader]
composite = "spectrum.wgsl"

[palette]
color0 = [0.85, 0.20, 0.55, 1.0]   # magenta (low-freq bar)
color1 = [0.20, 0.85, 0.95, 1.0]   # cyan (high-freq bar)
color2 = [0.85, 0.95, 1.00, 1.0]   # waveform white
color3 = [1.00, 1.00, 1.00, 1.0]   # unused highlight
