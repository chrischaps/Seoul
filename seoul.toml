# Seoul settings. Every key is optional; edits apply live while running.
# Command-line flags (see `seoul --help`) override what's here.

# Preset to start on, by name.
# start_preset = "Default"

fullscreen = false
# monitor = 0          # which display to go fullscreen on

# Feedback resolution relative to the window. Lower = faster and softer.
render_scale = 1.0

[auto]
# Advance presets automatically (toggle live with A).
enabled = false
# Earliest a change may happen; after this it waits for a downbeat.
min_interval = 20.0
# Change regardless of the music after this long.
max_interval = 45.0

[transition]
# crossfade | dissolve | radial | clock | zoom | random
style = "random"
duration = 3.0

[post]
# Global look defaults; a preset's own [post] table overrides these.
# exposure = 1.0
# bloom = 0.35
# bloom_threshold = 0.7
# vignette = 0.3
# grain = 0.15
# saturation = 1.05

[hud]
enabled = true
stats = false          # F1 toggles live
toast_seconds = 3.0

[audio]
# "loopback" listens to what this computer plays. "input" listens to a
# microphone or line-in, so Seoul hears the room. `seoul --list-inputs`
# shows the device names; --mic and --input <NAME> override this.
source = "loopback"
# device = "USB"       # input only: first device whose name contains this
# Room tuning for inputs: learns the room's noise floor and slowly lifts
# quiet sound. Turn it off for a clean line-in feed.
room = true

[frame]
# Seoul as a picture on the wall (or start with --frame): fullscreen, no
# HUD or cursor, presets advance on their own. When the room is quiet the
# picture rests, slow and dim; talk lifts it a little; music plays it fully.
enabled = false
# "favorites" plays only your favorites (F), once there are any; or "all".
playlist = "favorites"
# A warmer, dimmer grade from `night`; the screen sleeps from `sleep` until
# `wake`. A record played in the sleep window still wakes it.
night = "20:00"
sleep = "23:00"
wake = "07:00"

[link]
# Listen for a Soba patch (or any OSC sender) on 127.0.0.1. See docs/LINK.md.
enabled = true
port = 9137
# Loopback audio reaches Seoul later than link messages. Delay the link by
# this much so a gate flash lands with the kick you hear. Tune by ear (0–1000).
delay_ms = 0
